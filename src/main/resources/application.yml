server:
  port: ${SERVER_PORT:8084}
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: rrhh-asistencia
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/rrhh_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:rrhh}
    password: ${SPRING_DATASOURCE_PASSWORD:rrhh_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      # Redis solo se usa como stream local; no hay repositorios Redis.
      repositories:
        enabled: false
  flyway:
    enabled: true
    table: flyway_history_asistencia
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx}
          audiences: ${COGNITO_AUDIENCE:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Redis solo se usa como stream local (RRHH_STREAMING_BACKEND=redis); en AWS no existe y no debe tumbar el health check.
    redis:
      enabled: ${RRHH_REDIS_HEALTH_ENABLED:false}
rrhh:
  # Stream de eventos (ADR-019). Si RRHH_KINESIS_ENABLED=true se publica a Kinesis (AWS, lo entrega Terraform);
  # si no, RRHH_STREAMING_BACKEND=redis publica a Redis Streams (local). Sin ninguno, el outbox acumula PENDIENTE.
  kinesis:
    enabled: ${RRHH_KINESIS_ENABLED:false}
    stream-name: ${KINESIS_STREAM_NAME:}
    region: ${AWS_REGION:us-east-1}
  streaming:
    backend: ${RRHH_STREAMING_BACKEND:}
    redis-stream-key: ${RRHH_STREAMING_REDIS_KEY:rrhh:events}
    redis-max-len: ${RRHH_STREAMING_REDIS_MAX_LEN:10000}
    publish-delay-ms: ${STREAMING_PUBLISH_DELAY_MS:5000}
  # Telemetría de APIs (fase 5 de streaming, piloto en asistencia): un registro por request al stream
  # rrhh-api-telemetry, de mejor esfuerzo y sin outbox. Con la bandera, TELEMETRY_STREAM_NAME vacío impide arrancar.
  telemetry:
    enabled: ${RRHH_TELEMETRY_ENABLED:false}
    stream-name: ${TELEMETRY_STREAM_NAME:}
  security:
    jwt:
      role-claim: ${JWT_ROLE_CLAIM:custom:role}
      tenant-claim: ${JWT_TENANT_CLAIM:custom:tenant_id}
      user-id-claim: ${JWT_USER_ID_CLAIM:custom:user_id}
      trabajador-id-claim: ${JWT_TRABAJADOR_ID_CLAIM:custom:trabajador_id}
